# Public relay in front of the codes service. The service itself never faces the Internet: it only listens on a
# Unix socket shared with this container. Here: GET only, nothing but /v1/, per-IP rate and connection limits.
limit_req_zone  $binary_remote_addr zone=api:1m  rate=60r/m;
limit_req_zone  $binary_remote_addr zone=test:1m rate=4r/m;
limit_conn_zone $binary_remote_addr zone=conn:1m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1k;

  # trust X-Forwarded-For only from the reverse proxy in front (private Docker networks)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /v1/ {
    limit_except GET { deny all; }
    limit_req zone=api burst=30 nodelay;
    limit_req_status 429;
    limit_conn conn 10;
    limit_conn_status 429;
    proxy_pass http://unix:/run/codes/codes.sock;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host codes;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 70s;
    proxy_buffering off;
  }

  # empty answer on / : handy for uptime checks, says nothing about what runs here
  location = / {
    return 204;
  }

  # static pages to try the extension, plus their "send me a code" button
  location = /test { return 301 /test/; }
  location /test/ {
    alias /usr/share/nginx/test/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  location = /test/send {
    limit_except POST { deny all; }
    limit_req zone=test burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://unix:/run/codes/codes.sock:/test/send;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host codes;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 40s;
  }

  location / {
    return 404;
  }
}
