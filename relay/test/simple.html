<h1>Verify it's you</h1><p><button id="send">Send me a code</button></p><p id="state"></p>
<form id="f"><label for="c">Verification code</label><br>
<input id="c" name="c" autocomplete="one-time-code" inputmode="numeric" maxlength="8" class="big"><br>
<button>Verify</button></form><p id="result"></p>
<script src="test.js"></script>
<script>document.getElementById("f").onsubmit = (e) => { e.preventDefault(); verify(document.getElementById("c").value); };</script>
